[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos"
version = "0.2.25"
requires-python = ">=3.13"
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "cryptography>=43,<46",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    # Cosine similarity over the retrieval index. Pure-Python dot products over
    # tens of thousands of vectors take seconds per search; numpy takes
    # milliseconds. It is the only dependency the local RAG index adds.
    "numpy>=2.1,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "openpyxl>=3.1,<4",
    "Pillow>=11,<12",
    "playwright>=1.53,<2",
    "pypdf>=5,<7",
    "pypdfium2>=4,<5",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.9,<1",
    "python-pptx>=1,<2",
    # Windows does not ship the IANA database used by zoneinfo. Keep it in the
    # application package so schedules behave the same on every supported host.
    "tzdata>=2025.2,<2027",
    "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
# The single public entry point. A frozen build exposes the same callable as
# orin.exe, so nothing that depends on it has to change when Orin is packaged.
orin = "agentos.launcher.cli:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.11,<7",
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
