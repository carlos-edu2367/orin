[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "arq>=0.26,<1",
    "cryptography>=43,<46",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.9,<1",
    "python-pptx>=1,<2",
    "redis>=5.2,<7",
    "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
# The single public entry point. A frozen build exposes the same callable as
# orin.exe, so nothing that depends on it has to change when Orin is packaged.
orin = "agentos.launcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
