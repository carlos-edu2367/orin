[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.14,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
