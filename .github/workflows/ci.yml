name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python test runner
        run: uv sync --frozen --all-groups
      - name: Run Python suite
        run: uv run pytest -q --tb=short

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm.cmd --prefix frontend ci
      - name: Lint
        run: npm.cmd --prefix frontend run lint
      - name: Run component tests
        run: npm.cmd --prefix frontend test
      - name: Build frontend
        run: npm.cmd --prefix frontend run build
      - name: Install Chromium for browser tests
        working-directory: frontend
        run: npx playwright install chromium
      - name: Run browser tests
        run: npm.cmd --prefix frontend run test:e2e
