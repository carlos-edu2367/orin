name: Publish Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish, without v
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Resolve and verify release version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') { throw 'Release version must be semantic version format.' }
          $package = Get-Content desktop/package.json -Raw | ConvertFrom-Json
          if ($package.version -ne $version) { throw "Tag version $version does not match desktop/package.json version $($package.version)." }
          "ORIN_RELEASE_VERSION=$version" | Add-Content -Path $env:GITHUB_ENV
      - name: Create isolated Python runtime
        run: uv sync --frozen --all-groups
      - name: Build packaged Windows release
        shell: pwsh
        run: .\scripts\build-windows.ps1 -SkipTests
      - name: Verify generated manifest
        shell: pwsh
        run: |
          $manifest = Get-Content dist/release.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:ORIN_RELEASE_VERSION) { throw 'Generated manifest version differs from release version.' }
          $hash = (Get-FileHash -LiteralPath "dist/Orin-$env:ORIN_RELEASE_VERSION-windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $manifest.archive_sha256) { throw 'Generated archive hash differs from release.json.' }
      - name: Publish GitHub release assets
        shell: pwsh
        run: |
          $tag = "v$env:ORIN_RELEASE_VERSION"
          gh release create $tag "dist/Orin-$env:ORIN_RELEASE_VERSION-windows-x64.zip" dist/release.json dist/install.ps1 --title "Orin $env:ORIN_RELEASE_VERSION" --generate-notes
