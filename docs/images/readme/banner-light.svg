      <circle cx="18" cy="15" r="4.5" fill="#10b981"/>
      <text x="30" y="19.5" fill="#181623" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">((•)) LIVE FULL-DUPLEX</text>
    </g>
  </g>

  <!-- Bottom 3 Pillar Cards -->
  <g transform="translate(80, 346)">
    <!-- Card 1: Orin Friend -->
    <g transform="translate(0, 0)">
