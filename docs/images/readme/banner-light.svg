<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 510" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf9f6"/>
      <stop offset="50%" stop-color="#f5f3ef"/>
      <stop offset="100%" stop-color="#f3f0ff"/>
    </linearGradient>
    <radialGradient id="glowVioletL" cx="28%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#B4A4EF" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#8b5cf6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarmL" cx="78%" cy="36%" r="45%">
      <stop offset="0%" stop-color="#B4A4EF" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mascotHaloL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B4A4EF" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGradL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#181623"/>
      <stop offset="55%" stop-color="#282333"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <pattern id="gridL" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#181623" stroke-width="1" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="510" rx="24" fill="url(#bgLight)"/>
  <rect width="1280" height="510" rx="24" fill="url(#glowVioletL)"/>
  <rect width="1280" height="510" rx="24" fill="url(#glowWarmL)"/>
  <rect width="1280" height="510" rx="24" fill="url(#gridL)"/>
  <rect x="1" y="1" width="1278" height="508" rx="23" fill="none" stroke="#d8d2eb" stroke-width="1.5"/>

  <!-- Top Version & Local-First Pill -->
  <g transform="translate(80, 48)">
    <rect x="0" y="0" width="430" height="32" rx="16" fill="#ffffff" stroke="#B4A4EF" stroke-width="1.2"/>
    <circle cx="18" cy="16" r="4.5" fill="#10b981"/>
    <text x="32" y="20.5" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" letter-spacing="0.6">ORIN v0.11.0 · LOCAL-FIRST AI WORKSPACE &amp; COMPANION</text>
  </g>

  <!-- Left Hero Typography -->
  <g transform="translate(80, 148)">
    <text x="0" y="0" fill="url(#titleGradL)" font-family="Georgia, 'Times New Roman', -apple-system, BlinkMacSystemFont, 'Segoe UI', serif" font-size="76" font-weight="700" letter-spacing="-1.5">Orin</text>
    <text x="168" y="-12" fill="#6d28d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700">✦ Friend · Chat · Equipes · Code</text>

    <text x="0" y="48" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="21" font-weight="500">
      Seu companheiro de voz em tempo real, equipe multiagente de pesquisa
    </text>
    <text x="0" y="78" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="21" font-weight="400">
      e bancada completa de engenharia de software — rodando no seu PC.
    </text>

    <!-- Feature Pills Row -->
    <g transform="translate(0, 104)">
      <rect x="0" y="0" width="166" height="28" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
      <text x="14" y="18.5" fill="#5b21b6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">● Voz Full-Duplex PT-BR</text>

      <rect x="178" y="0" width="184" height="28" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
      <text x="192" y="18.5" fill="#5b21b6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">● Split Workbench &amp; Diff</text>

      <rect x="374" y="0" width="196" height="28" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
      <text x="388" y="18.5" fill="#5b21b6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">● Claude Code CLI Bridge</text>

      <rect x="582" y="0" width="168" height="28" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/>
      <text x="596" y="18.5" fill="#5b21b6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700">● Máquina do Tempo</text>
    </g>
  </g>

  <!-- Right Official Orin Mascot & Live Aura -->
  <g transform="translate(1045, 185)">
