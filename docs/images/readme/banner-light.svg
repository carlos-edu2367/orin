          M 55 46
          C 48 29, 58 21, 68 35
          C 74 14, 95 18, 87 37
          C 115 38, 137 66, 139 96
          C 142 125, 121 138, 81 139
          C 42 140, 20 128, 21 102
          C 22 77, 35 55, 55 46
