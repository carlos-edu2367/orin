      <rect x="18" y="18" width="36" height="36" rx="10" fill="#f3e8ff" stroke="#c4b5fd"/>
      <text x="27" y="42" fill="#6d28d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">✦</text>
      <text x="66" y="34" fill="#181623" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16.5" font-weight="700">Orin Friend &amp; Modo LIVE</text>
