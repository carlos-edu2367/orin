    <circle cx="0" cy="0" r="110" fill="none" stroke="#7c3aed" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="6 8"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#7c3aed" stroke-opacity="0.35" stroke-width="1.5"/>

