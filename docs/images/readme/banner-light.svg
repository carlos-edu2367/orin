    <g transform="translate(380, 0)">
      <rect width="360" height="114" rx="16" fill="#ffffff" fill-opacity="0.94" stroke="#d8d2eb" stroke-width="1.2"/>
      <rect x="18" y="18" width="36" height="36" rx="10" fill="#e0f2fe" stroke="#7dd3fc"/>
      <text x="27" y="41" fill="#0284c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700">💬</text>
      <text x="66" y="34" fill="#181623" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16.5" font-weight="700">Chat, Equipes &amp; Memória</text>
      <text x="66" y="55" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5">Leitura PDF/Office, visão, equipe multiagente,</text>
      <text x="66" y="73" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5">ações agendadas, skills e conexões MCP.</text>
      <text x="66" y="95" fill="#0284c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">Memória (Trabalho/Friend/Projeto) · Equipes</text>
    </g>

    <!-- Card 3: Orin Code & Máquina do Tempo -->
    <g transform="translate(760, 0)">
      <rect width="360" height="114" rx="16" fill="#ffffff" fill-opacity="0.94" stroke="#d8d2eb" stroke-width="1.2"/>
      <rect x="18" y="18" width="36" height="36" rx="10" fill="#fef3c7" stroke="#fcd34d"/>
      <text x="25" y="41" fill="#b45309" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">&gt;_</text>
      <text x="66" y="34" fill="#181623" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16.5" font-weight="700">Orin Code &amp; Máquina do Tempo</text>
      <text x="66" y="55" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5">Split Workbench (Prévia, Arquivos e Terminal),</text>
      <text x="66" y="73" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5">checkpoints SHA-256, AST Shell e 33 hooks.</text>
      <text x="66" y="95" fill="#b45309" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700">orin code · Claude CLI Bridge · OpenCode</text>
    </g>
