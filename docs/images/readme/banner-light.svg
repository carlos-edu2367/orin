    <circle cx="-78" cy="-58" r="4.5" fill="#8b5cf6" fill-opacity="0.8"/>
    <circle cx="84" cy="-52" r="3.5" fill="#0284c7" fill-opacity="0.8"/>
    <circle cx="-94" cy="18" r="3.5" fill="#ec4899" fill-opacity="0.7"/>
    <circle cx="92" cy="24" r="4.5" fill="#7c3aed" fill-opacity="0.8"/>
    <circle cx="0" cy="-98" r="3.5" fill="#f59e0b" fill-opacity="0.85"/>

    <!-- Official OrinMascot SVG (centered at 0,0) -->
    <g transform="translate(-84, -88) scale(1.05)">
