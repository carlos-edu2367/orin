<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orin</title>
    <link rel="stylesheet" href="./splash.css" />
  </head>
  <body>
    <main class="splash-shell">
      <section class="splash-card" aria-labelledby="title" data-phase="starting">
        <div class="orb" aria-hidden="true">
          <svg viewBox="0 0 120 120" class="orb-ring">
            <circle class="orb-track" cx="60" cy="60" r="52" />
            <circle id="orb-progress" class="orb-progress" cx="60" cy="60" r="52" />
          </svg>
          <span class="orb-mark">
            <svg viewBox="0 0 160 160" width="38" height="38" fill="none" aria-hidden="true">
              <defs>
                <radialGradient id="splashMascotGrad" cx="36%" cy="30%" r="68%" fx="36%" fy="30%">
                  <stop offset="0%" stop-color="#E6DFFF" />
                  <stop offset="55%" stop-color="#B4A4EF" />
                  <stop offset="100%" stop-color="#8E79DF" />
                </radialGradient>
              </defs>
              <path d="M 55 46 C 48 29, 58 21, 68 35 C 74 14, 95 18, 87 37 C 115 38, 137 66, 139 96 C 142 125, 121 138, 81 139 C 42 140, 20 128, 21 102 C 22 77, 35 55, 55 46 Z" fill="url(#splashMascotGrad)" />
              <ellipse cx="61" cy="88" rx="5" ry="11" fill="#282333" transform="rotate(-5 61 88)" />
              <ellipse cx="101" cy="86" rx="5" ry="11" fill="#282333" transform="rotate(-5 101 86)" />
              <path d="M 76 105 Q 81 112 87 104" fill="none" stroke="#282333" stroke-width="3.2" stroke-linecap="round" />
            </svg>
          </span>
        </div>
        <p class="eyebrow">ORIN · AMBIENTE LOCAL</p>
        <h1 id="title">Preparando seu ambiente</h1>
        <p id="message" class="message" role="status">Conectando…</p>
        <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progresso de inicialização">
          <span id="progress-bar"></span>
        </div>
        <p class="percent"><span id="percent">0</span>%</p>
        <ol id="steps" class="steps" aria-label="Etapas da inicialização"></ol>
        <section id="failure-actions" class="failure-actions" hidden>
          <button id="retry" class="button button-primary" type="button">Tentar novamente</button>
          <button id="open-logs" class="button" type="button">Abrir logs</button>
          <button id="close" class="button button-quiet" type="button">Fechar</button>
        </section>
        <p class="tip" id="tip">Dica: ao fechar a janela, você pode manter o Orin em segundo plano para que as tarefas agendadas continuem rodando.</p>
      </section>
    </main>
    <script src="./splash.js"></script>
  </body>
</html>
